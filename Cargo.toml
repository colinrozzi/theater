[workspace]
members = [
    "crates/theater",
    "crates/theater-cli",
    "crates/theater-chain",
    "crates/theater-guest",
    "crates/theater-guest-macros",
    # Theater-specific handlers (to be migrated to Composite)
    "crates/theater-handler-message-server",
    "crates/theater-handler-runtime",
    "crates/theater-handler-self",
    "crates/theater-handler-lifecycle",
    "crates/theater-handler-store",
    "crates/theater-handler-supervisor",
    "crates/theater-handler-tcp",
    "crates/theater-handler-terminal",
    "crates/theater-handler-timer",
    "crates/theater-handler-assembler",
    "crates/theater-handler-rpc",
    "crates/theater-handler-loop",
    "crates/theater-handler-podman",
    "crates/theater-handler-http-client",
    "crates/theater-tests",
]
exclude = [
    "crates/theater-cli/templates/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Colin Rozzi <colinrozzi+theater@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/colinrozzi/theater"
homepage = "https://colinrozzi.github.io/theater"
keywords = ["wasm", "actor", "ai", "agents", "webassembly"]
categories = ["wasm", "concurrency", "development-tools"]
rust-version = "1.86.0"

[workspace.dependencies]
anyhow = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7.13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Workspace dep versions track each crate's current local version so
# `cargo publish` resolves to the version being released, not whatever
# permissive range "0.3" happens to find on crates.io. (Without this,
# `cargo publish -p X` verify-builds against a stale dep from the index
# and fails on APIs added in the unreleased local source.)
theater-chain = { version = "0.3.11", path = "crates/theater-chain" }
theater = { version = "0.3.28", path = "crates/theater" }
# Theater-specific handlers
theater-handler-message-server = { version = "0.3.13", path = "crates/theater-handler-message-server" }
theater-handler-runtime = { version = "0.3.0", path = "crates/theater-handler-runtime" }
theater-handler-self = { version = "0.3.14", path = "crates/theater-handler-self" }
theater-handler-lifecycle = { version = "0.3.14", path = "crates/theater-handler-lifecycle" }
theater-handler-store = { version = "0.3.12", path = "crates/theater-handler-store" }
theater-handler-supervisor = { version = "0.3.19", path = "crates/theater-handler-supervisor" }
theater-handler-tcp = { version = "0.3.21", path = "crates/theater-handler-tcp" }
theater-handler-terminal = { version = "0.3.11", path = "crates/theater-handler-terminal" }
theater-handler-timer = { version = "0.3.13", path = "crates/theater-handler-timer" }
theater-handler-assembler = { version = "0.3.11", path = "crates/theater-handler-assembler" }
theater-handler-rpc = { version = "0.3.11", path = "crates/theater-handler-rpc" }
theater-handler-loop = { version = "0.3.11", path = "crates/theater-handler-loop" }
theater-handler-podman = { version = "0.3.13", path = "crates/theater-handler-podman" }
theater-handler-http-client = { version = "0.3.0", path = "crates/theater-handler-http-client" }

# Pack runtime integration (Graph ABI-based WASM runtime)
# 0.10.4: decoder fix — caches only shared (multi-parent) nodes instead of
# deep-cloning every subtree, cutting decode PEAK MEMORY ~3-7x -> ~1x. Fixes the
# capped-heap OOM-spin when a self-contained actor decodes a large stored state
# (inbox mailbox load_state of a ~1MB MailboxState). Host bump is ALIGNMENT-only
# (host memory is native/uncapped); the load-bearing fix is guests recompiling
# against packr-guest 0.10.4. Wire format unchanged; no data migration.
# 0.10.5: epoch guardrail — AsyncRuntime enables wasmtime epoch_interruption;
# theater drives engine().increment_epoch() on a 1/sec ticker + arms a per-call
# set_epoch_deadline, so a runaway guest (a decode/loop/etc.) TRAPS on the
# deadline instead of pegging a core forever. Makes a spinning actor.init fail
# clean -> the parent skips it -> the spine comes up degraded, not wedged.
# 0.10.6: fixes the instantiate-path u64::MAX "never-trap" default, which
# overflowed current_epoch()+delta once the ticker advanced the epoch past 0
# (panic in debug, wrap-to-garbage in release) — default is now u64::MAX/2.
# Required for the epoch arming above to actually work; 0.10.5 could not ship armed.
# 0.11.0: HARD BREAK — all composition/fuse machinery retired (link, Layout,
# LinkBinary, DEFAULT_ALLOCATOR_WASM, internalize, `theater compose`). An actor is
# now a PLAIN cargo build: setup_guest!() links dlmalloc in, the cdylib exports its
# own (GROWABLE) memory + __pack_alloc/__pack_free + lifecycle, imports only host
# theater:simple/*. Growable memory deletes the capped-heap OOM class (the mail-spine
# wedge). The runtime loader (Runtime/AsyncRuntime/Module) is unchanged — it already
# loads plain-built actors — so this is a build/CLI change, not a loader change.
packr = "0.23.0"
packr-abi = "0.23.0"

# Metadata for Nix crane builds
[workspace.metadata.crane]
name = "theater"
