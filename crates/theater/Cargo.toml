[package]
name = "theater"
description = "A WebAssembly actor system for AI agents"
version = "0.3.29"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
# Core dependencies
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

theater-chain.workspace = true
theater-store.workspace = true

# WebAssembly runtime
wasmtime = { version = "31.0", features = ["component-model", "async"] }

# Pack runtime (Graph ABI-based WASM runtime)
packr.workspace = true
packr-abi = { workspace = true, features = ["derive"] }
async-trait = "0.1"
sha2.workspace = true

# Additional core deps
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
toml = "0.8"
rand = "0.8.5"
sha1 = "0.10"
hex = "0.4.3"

# Variable substitution
handlebars = "6.0"
reqwest = { version = "0.11", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Cyclic dev-dependency (permitted by cargo): the doctests build a real
# `TheaterRuntime` with the native driver. theater-native depends on theater.
theater-native.workspace = true
test-log = "0.2"
pretty_assertions = "1.4"
tempfile = "3.8.1"
mockall = "0.11.4"
# For the self-contained gate test: link a fixture member + bundled allocator
# into a self-contained composite in-test (packr::link, DEFAULT_ALLOCATOR_WASM).
packr.workspace = true
